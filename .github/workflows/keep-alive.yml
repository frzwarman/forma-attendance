# Supabase pauses a Free Plan project after about a week without user traffic; a few requests a day keep it
# running. This reads the public settings row once a day with the publishable key (the same public values
# the site uses, kept as repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY). Delete the workflow
# when the project may pause. GitHub itself disables scheduled workflows after 60 days without a commit, and
# mails a warning first; any commit turns it back on.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 2 * * *" # 09:17 WIB, daily
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the settings row
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$URL" || { echo "Set the SUPABASE_URL repository secret"; exit 1; }
          test -n "$KEY" || { echo "Set the SUPABASE_PUBLISHABLE_KEY repository secret"; exit 1; }
          curl --fail --silent --show-error "$URL/rest/v1/guestbook_settings?select=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
